name: Build ChessCam APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Stockfish binary
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        # Tải file từ Google Drive
        curl -L -o app/src/main/jniLibs/arm64-v8a/libstockfish.so "https://drive.google.com/uc?export=download&id=1kXRjruKeNw5ipoSIs0S8uXnW2SF8QeDf"
        chmod +x app/src/main/jniLibs/arm64-v8a/libstockfish.so

    # Cấp quyền cho gradlew (nếu bạn đã up file gradlew lên)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Tự động tạo Gradle Wrapper nếu bạn chưa up file gradlew
    - name: Generate Gradle Wrapper (if missing)
      run: gradle wrapper
      if: hashFiles('gradlew') == ''

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ChessCam-APK
        path: app/build/outputs/apk/debug/app-debug.apk
